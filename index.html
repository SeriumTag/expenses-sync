    <script>
      // If the app can't start (for example an old copy of this page, kept by
      // the phone after an update, asks for files that no longer exist), reload
      // once with fresh files. If that still fails, offer a button instead of
      // leaving the splash up forever.
      (function () {
        var KEY = 'es-fresh-reload';
        function reloadFresh() {
          try { sessionStorage.setItem(KEY, String(Date.now())); } catch (e) {}
          location.replace(location.pathname + '?fresh=' + Date.now() + location.hash);
        }
        function stuck() {
          if (window.__esStarted) return;
          var last = 0;
          try { last = Number(sessionStorage.getItem(KEY)) || 0; } catch (e) {}
          if (Date.now() - last > 60000) return reloadFresh();
          var splash = document.getElementById('splash');
          if (!splash || splash.querySelector('.stuck')) return;
          var box = document.createElement('div');
          box.className = 'stuck';
          box.innerHTML = 'Having trouble loading.<br><button type="button">Tap to reload</button>';
          box.querySelector('button').onclick = reloadFresh;
          splash.appendChild(box);
        }
        // A failed app file (script error before the app starts) triggers it right away.
        window.addEventListener('error', function (e) {
          if (e.target && e.target.tagName === 'SCRIPT' && !window.__esStarted) stuck();
        }, true);
        setTimeout(stuck, 8000);
      })();
    </script>

    <!-- Splash: starts exactly where the iPhone launch screen leaves off, then animates. -->
    <style>
      html, body { background: #fff7f1; }
      #splash {
        position: fixed; inset: 0; z-index: 9999; overflow: hidden; transition: opacity 0.45s ease 0.15s;
        background:
          radial-gradient(60vw 60vw at 12% 18%, #f9cfd9, transparent 70%),
          radial-gradient(55vw 55vw at 92% 28%, #d9cff8, transparent 70%),
          radial-gradient(70vw 70vw at 25% 105%, #c7ecdc, transparent 70%),
          radial-gradient(50vw 50vw at 100% 95%, #fcdcc6, transparent 70%),
          #fff7f1;
      }
      #splash .mark {
        position: absolute; left: 50%; top: 45%; width: min(28vw, 150px);
        transform: translate(-50%, -50%);
        animation: splash-bounce 1.2s cubic-bezier(0.3, 1.4, 0.5, 1) both;
        transition: transform 0.5s cubic-bezier(0.6, 0, 0.8, 0.2), opacity 0.4s ease 0.1s;
        filter: drop-shadow(0 10px 18px rgba(170, 110, 100, 0.25));
      }
      #splash .word {
        position: absolute; left: 0; right: 0; text-align: center;
        top: calc(45% + min(28vw, 150px) * 0.58 + 26px);
        font: 600 clamp(26px, 7.5vw, 38px) / 1 'Fredoka', 'Nunito', system-ui, sans-serif;
        color: #4b3a33;
        animation: splash-word 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 0.3s both;
        transition: opacity 0.25s;
      }
      #splash .word b { color: #e07f98; font-weight: 600; }
      #splash .dots { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 60px); transform: translateX(-50%); display: flex; gap: 8px; }
      #splash .dots i { width: 9px; height: 9px; border-radius: 50%; animation: splash-dot 1s ease-in-out infinite; }
      #splash .dots i:nth-child(1) { background: #f29cb2; }
      #splash .dots i:nth-child(2) { background: #a99be6; animation-delay: 0.15s; }
      #splash .dots i:nth-child(3) { background: #7fcfb2; animation-delay: 0.3s; }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash.hide .mark { transform: translate(-50%, -50%) scale(1.8); opacity: 0; }
      #splash.hide .word, #splash.hide .dots { opacity: 0; }
      @keyframes splash-bounce {
        0% { transform: translate(-50%, -50%) scale(1); }
        30% { transform: translate(-50%, -54%) scale(1.04, 0.97) rotate(-4deg); }
        60% { transform: translate(-50%, -50%) scale(0.98, 1.02) rotate(3deg); }
        100% { transform: translate(-50%, -50%) scale(1) rotate(0); }
      }
      @keyframes splash-word { from { opacity: 0; transform: translateY(10px); } }
      @keyframes splash-dot { 50% { transform: translateY(-7px); } }
      #splash .stuck {
        position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 110px);
        text-align: center; font: 700 15px/1.5 'Nunito', system-ui, sans-serif; color: #8d786d;
      }
      #splash .stuck button {
        margin-top: 10px; font: 800 15px 'Nunito', system-ui, sans-serif; color: #4b3a33;
        background: #f29cb2; border: none; border-radius: 999px; padding: 10px 22px;
      }
      @media (prefers-reduced-motion: reduce) {
        #splash *, #splash .dots i { animation: none !important; transition: none !important; }
      }
    </style>
