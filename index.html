  <head>

    <meta name="color-scheme" content="dark" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Expenses" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="apple-touch-startup-image" media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/iphone-1290x2796.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/iphone-1284x2778.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 420px) and (device-height: 912px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/iphone-1260x2736.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/iphone-1242x2688.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/splash/iphone-828x1792.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/iphone-1242x2208.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/iphone-1206x2622.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/iphone-1179x2556.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/iphone-1170x2532.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/iphone-1125x2436.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/splash/iphone-750x1334.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Splash: starts exactly where the iPhone launch screen leaves off, then animates. -->
    <style>
      html, body { background: #000; }
      #splash { position: fixed; inset: 0; z-index: 9999; background: #000; overflow: hidden; transition: opacity 0.45s ease 0.15s; }
      #splash::before {
        content: ''; position: absolute; inset: 0;
        background: radial-gradient(circle at 50% 45%, rgba(229, 9, 20, 0.2), rgba(229, 9, 20, 0) 75vw);
        animation: splash-breathe 1.6s ease-in-out infinite alternate;
      }
      #splash .mark {
        position: absolute; left: 50%; top: 45%; width: min(28vw, 170px);
        transform: translate(-50%, -50%);
        animation: splash-glow 1.4s ease-out both;
        transition: transform 0.6s cubic-bezier(0.7, 0, 0.84, 0), opacity 0.45s ease 0.1s;
      }
      #splash .word {
        position: absolute; left: 0; right: 0; text-align: center;
        top: calc(45% + min(28vw, 170px) * 0.64 + 28px);
        font: 400 clamp(26px, 8vw, 40px) / 1 'Bebas Neue', 'Arial Narrow', sans-serif;
        color: #fff; letter-spacing: 0.24em; padding-left: 0.24em;
        animation: splash-word 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) 0.25s both;
        transition: opacity 0.25s;
      }
      #splash .word b { color: #e50914; font-weight: 400; }
      #splash .bar {
        position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 56px);
        width: 72px; height: 3px; margin-left: -36px; border-radius: 3px;
        background: rgba(255, 255, 255, 0.12); overflow: hidden;
      }
      #splash .bar::after {
        content: ''; position: absolute; inset: 0; width: 40%; border-radius: 3px; background: #e50914;
        animation: splash-load 1.1s ease-in-out infinite;
      }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash.hide .mark { transform: translate(-50%, -50%) scale(2.2); opacity: 0; }
      #splash.hide .word, #splash.hide .bar { opacity: 0; }
      @keyframes splash-glow {
        0% { filter: drop-shadow(0 0 0 rgba(229, 9, 20, 0)); }
        55% { filter: drop-shadow(0 0 26px rgba(229, 9, 20, 0.85)); }
        100% { filter: drop-shadow(0 0 12px rgba(229, 9, 20, 0.45)); }
      }
      @keyframes splash-word { from { opacity: 0; letter-spacing: 0.7em; } to { opacity: 1; letter-spacing: 0.24em; } }
      @keyframes splash-load { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @keyframes splash-breathe { to { opacity: 0.6; } }
      @media (prefers-reduced-motion: reduce) {
        #splash *, #splash::before, #splash .bar::after { animation: none !important; transition: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <svg class="mark" viewBox="290 220 460 590" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="s-stem" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#9e0710" />
            <stop offset="1" stop-color="#6d040a" />
          </linearGradient>
          <linearGradient id="s-bar" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ff2a36" />
            <stop offset="1" stop-color="#e50914" />
          </linearGradient>
          <filter id="s-fold" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="-16" dy="6" stdDeviation="14" flood-color="#000" flood-opacity="0.6" />
          </filter>
        </defs>
        <path d="M318 236 H462 V788 H318 Z" fill="url(#s-stem)" />
        <g filter="url(#s-fold)">
          <path d="M404 236 H736 L694 374 H404 Z" fill="url(#s-bar)" />
          <path d="M404 443 H652 L612 581 H404 Z" fill="url(#s-bar)" />
          <path d="M404 650 H736 L694 788 H404 Z" fill="url(#s-bar)" />
        </g>
      </svg>
      <div class="word">Expense <b>Sync</b></div>
      <div class="bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
