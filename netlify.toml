[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# A missing app file (e.g. requested by an old copy of the page after an
# update) must be a real 404, not index.html, or the app can't recover.
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

# Single-page app: every other path (including /?join=CODE links) serves index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Always fetch the page itself fresh, so phones (and home-screen apps) pick up
# updates. Built files have unique names per version and can be kept forever.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
